[project]
name = "humaniser"
version = "0.1.0"
description = "Web interface for the jialinyyzz/humanizer model: rewrites AI drafts so they read like a person wrote them"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
humaniser = "humaniser.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["humaniser"]

[tool.setuptools.package-data]
humaniser = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
